<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="600" cy="200" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="630" fill="#090d16" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Ambient Circles -->
  <circle cx="150" cy="120" r="180" fill="#6366f1" fill-opacity="0.06" filter="blur(40px)" />
  <circle cx="1050" cy="500" r="220" fill="#a855f7" fill-opacity="0.06" filter="blur(50px)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.15">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Centered Hero Container -->
  <!-- Logo Icon Badge -->
  <g transform="translate(600, 160)">
    <rect x="-48" y="-48" width="96" height="96" rx="28" fill="url(#brandGrad)" />
    <!-- Ghost Icon -->
    <path d="M-18 -2 C-18 -16 -10 -24 0 -24 C10 -24 18 -16 18 -2 V18 L12 12 L6 18 L0 12 L-6 18 L-12 12 L-18 18 Z" fill="#ffffff" />
    <circle cx="-6" cy="-4" r="2.5" fill="#4f46e5" />
    <circle cx="6" cy="-4" r="2.5" fill="#4f46e5" />
  </g>

  <!-- Main Title -->
  <text x="600" y="290" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    Ghost<tspan fill="url(#textGrad)">URL</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="600" y="348" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500" fill="#94a3b8" letter-spacing="-0.3">
    Ephemeral Short Links &amp; Zero-Storage P2P File Beaming
  </text>

  <!-- Feature Pill Badges -->
  <g transform="translate(600, 440)">
    <!-- Pill 1: Redis TTL -->
    <g transform="translate(-420, 0)">
      <rect x="0" y="0" width="200" height="46" rx="23" fill="#1e1b4b" stroke="#3730a3" stroke-width="1.5" />
      <text x="100" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">
        ⚡ Auto Redis TTL
      </text>
    </g>

    <!-- Pill 2: WebRTC P2P -->
    <g transform="translate(-200, 0)">
      <rect x="0" y="0" width="220" height="46" rx="23" fill="#064e3b" stroke="#047857" stroke-width="1.5" />
      <text x="110" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">
        📡 Encrypted WebRTC P2P
      </text>
    </g>

    <!-- Pill 3: Zero Storage -->
    <g transform="translate(40, 0)">
      <rect x="0" y="0" width="200" height="46" rx="23" fill="#3b0764" stroke="#6b21a8" stroke-width="1.5" />
      <text x="100" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#d8b4fe">
        🔒 Zero Server Storage
      </text>
    </g>

    <!-- Pill 4: Bcrypt Lock -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="180" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="90" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">
        🔑 Bcrypt Passcode
      </text>
    </g>
  </g>

  <!-- Bottom Brand Trust Mark -->
  <text x="600" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#64748b" letter-spacing="0.5">
    www.ghosturl.web.id • Account-less • Open Source • Pure In-Memory Privacy
  </text>
</svg>
