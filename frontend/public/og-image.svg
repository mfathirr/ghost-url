<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="emeraldGlow" cx="600" cy="220" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="65%" stop-color="#090d12" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090d12" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Deep Matte Canvas -->
  <rect width="1200" height="630" fill="#090d12" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />

  <!-- Subtle Engineering Grid -->
  <g opacity="0.08">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Centered Hero Container -->
  <!-- Logo Icon Badge Matching Appbar -->
  <g transform="translate(600, 150)">
    <rect x="-44" y="-44" width="88" height="88" rx="22" fill="#090d12" stroke="#27272a" stroke-width="2.5" />
    <g transform="translate(-24, -24) scale(2)">
      <path d="M9 10h.01" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 10h.01" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Main Title -->
  <text x="600" y="275" text-anchor="middle" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    Ghost<tspan fill="#10b981">URL</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="600" y="330" text-anchor="middle" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" letter-spacing="-0.3">
    Ephemeral Short Links | End-to-End Secret Notes | Zero-Storage P2P Drop
  </text>

  <!-- Feature Pill Badges in Signal Emerald & Stealth Dark -->
  <g transform="translate(600, 420)">
    <!-- Pill 1: Redis RAM -->
    <g transform="translate(-430, 0)">
      <rect x="0" y="0" width="200" height="44" rx="10" fill="#0c1319" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <text x="100" y="27" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#34d399">
        RAM AUTO-EVICTION
      </text>
    </g>

    <!-- Pill 2: WebRTC P2P -->
    <g transform="translate(-210, 0)">
      <rect x="0" y="0" width="200" height="44" rx="10" fill="#0c1319" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <text x="100" y="27" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#34d399">
        WEBRTC DATACHANNEL
      </text>
    </g>

    <!-- Pill 3: Zero Storage -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="200" height="44" rx="10" fill="#0c1319" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <text x="100" y="27" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#34d399">
        ZERO DISK LOGGING
      </text>
    </g>

    <!-- Pill 4: Bcrypt Lock -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="200" height="44" rx="10" fill="#0c1319" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <text x="100" y="27" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#34d399">
        BCRYPT PASSCODE
      </text>
    </g>
  </g>

  <!-- Bottom Brand Trust Mark -->
  <text x="600" y="540" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="14" font-weight="500" fill="#64748b" letter-spacing="1">
    GHOSTURL.WEB.ID • ACCOUNT-LESS • HARDWARE TTL • PURE IN-MEMORY PRIVACY
