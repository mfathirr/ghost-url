<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostURL | Share links and files that disappear.</title>
    <meta
      name="description"
      content="GhostURL lets you share links and files that automatically disappear. No account needed. Nothing stored. Just share and it's gone."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.ghosturl.web.id/" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#090d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <!-- Open Graph Metadata -->
    <meta property="og:site_name" content="GhostURL" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GhostURL | Share links and files that disappear." />
    <meta
      property="og:description"
      content="GhostURL lets you share links and files that automatically disappear. No account needed. Nothing stored. Just share and it's gone."
    />
    <meta property="og:url" content="https://www.ghosturl.web.id/" />
    <meta property="og:image" content="https://www.ghosturl.web.id/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GhostURL | Share links and files that disappear." />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GhostURL | Share links and files that disappear." />
    <meta
      name="twitter:description"
      content="GhostURL lets you share links and files that automatically disappear. No account needed. Nothing stored. Just share and it's gone."
    />
    <meta name="twitter:image" content="https://www.ghosturl.web.id/og-image.svg" />

    <!-- Schema.org JSON-LD for Search & AI Crawlers -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.ghosturl.web.id/#website",
            "url": "https://www.ghosturl.web.id/",
            "name": "GhostURL",
            "description": "Share links and files that automatically disappear. No account needed."
          },
          {
            "@type": "WebApplication",
            "@id": "https://www.ghosturl.web.id/#app",
            "name": "GhostURL",
            "url": "https://www.ghosturl.web.id/",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "All",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "featureList": [
              "Links auto-delete after your chosen time with zero cleanup needed",
              "No account or sign-up required",
              "Optional password protection for your shared link",
              "Anti-crawler safe burn defense prevents automated preview bots from destroying single-view secrets",
              "Duress passcode poison pill purges secrets with 404 plausible deniability under coercion",
              "Zero-knowledge cryptographic delivery receipts verify recipient view status without IP logging",
              "Send files directly to nearby devices with zero cloud uploads",
              "No file size limits for device-to-device transfers"
            ]
          }
        ]
      }
    </script>

    <!-- Prevent theme flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('ghost_theme');
        var isDark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Performance: Fonts & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 dark:bg-[#090d12] text-slate-900 dark:text-slate-100 min-h-[100dvh]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
