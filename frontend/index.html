<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostURL — Ephemeral Link Sharing &amp; P2P File Beaming</title>
    <meta
      name="description"
      content="GhostURL is a privacy-first, account-less platform for self-destructing short links with Redis TTL auto-eviction and zero-storage WebRTC peer-to-peer file beaming."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.ghosturl.web.id/" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <!-- Open Graph Metadata -->
    <meta property="og:site_name" content="GhostURL" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GhostURL — Ephemeral Link Sharing &amp; P2P File Beaming" />
    <meta
      property="og:description"
      content="Privacy-first, account-less short links with Redis TTL auto-expiry and zero-storage WebRTC peer-to-peer file beaming."
    />
    <meta property="og:url" content="https://www.ghosturl.web.id/" />
    <meta property="og:image" content="https://www.ghosturl.web.id/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GhostURL — Ephemeral Link Sharing and P2P File Beaming Banner" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GhostURL — Ephemeral Link Sharing &amp; P2P File Beaming" />
    <meta
      name="twitter:description"
      content="Privacy-first, account-less short links with Redis TTL auto-expiry and zero-storage WebRTC peer-to-peer file beaming."
    />
    <meta name="twitter:image" content="https://www.ghosturl.web.id/og-image.svg" />

    <!-- Schema.org JSON-LD for Search & AI Crawlers -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.ghosturl.web.id/#website",
            "url": "https://www.ghosturl.web.id/",
            "name": "GhostURL",
            "description": "Ephemeral link sharing and zero-storage WebRTC P2P file transfer."
          },
          {
            "@type": "WebApplication",
            "@id": "https://www.ghosturl.web.id/#app",
            "name": "GhostURL",
            "url": "https://www.ghosturl.web.id/",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "All",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "featureList": [
              "Self-destructing short links with Redis hardware TTL auto-eviction",
              "Optional salted bcrypt passcode protection",
              "Local-network peer-to-peer device discovery via WebRTC DataChannels",
              "GhostDrop: Browser-to-browser zero-storage file beaming of arbitrary size",
              "Zero persistent disk or database retention for transfers"
            ]
          }
        ]
      }
    </script>

    <!-- Prevent theme flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('ghost_theme');
        var isDark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Performance: Fonts & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
